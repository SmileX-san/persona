name: Windows installer archive

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-installer

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and assets
        run: npm run check

      - name: Validate distributable assets
        run: npm run assets:release

      - name: Build installer and test native listener
        run: npm run dist:windows

      - name: Write installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*-windows-x64-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows x64 installer was produced.' }
          $checksums = foreach ($installer in $installers) {
            $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($installer.Name)"
          }
          $checksums | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Upload installer as downloadable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: Persona-Windows-x64
          path: |
            release/*-windows-x64-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
